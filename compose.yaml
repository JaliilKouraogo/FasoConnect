name: fasoconnect
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurer .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes: ["db:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  identity-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Configurer .env}
    volumes: ["identity_db:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Configurer .env}
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?Configurer .env}
      DOMAIN: ${DOMAIN}
      OIDC_SECRET: ${OIDC_SECRET:?Configurer .env}
    volumes: ["./config/realm.json:/opt/keycloak/data/import/fasoconnect-realm.json:ro"]
    depends_on:
      identity-db: {condition: service_healthy}
    networks: [backend]
    restart: unless-stopped
  init:
    image: ghcr.io/element-hq/synapse:v1.161.0
    entrypoint: [python, /bootstrap/init.py]
    environment:
      OIDC_SECRET: ${OIDC_SECRET:?Configurer .env}
      DOMAIN: ${DOMAIN:?Configurer .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurer .env}
    volumes: ["synapse:/data", "./scripts/init.py:/bootstrap/init.py:ro"]
    networks: [backend]
  synapse:
    image: ghcr.io/element-hq/synapse:v1.161.0
    environment:
      PYTHONPATH: /modules
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    depends_on:
      init: {condition: service_completed_successfully}
      db: {condition: service_healthy}
    volumes: ["synapse:/data", "./scripts/policy.py:/modules/policy.py:ro"]
    networks: [backend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  element:
    image: vectorim/element-web:v1.12.32
    volumes: ["./config/element.json:/app/config.json:ro"]
    networks: [backend]
    restart: unless-stopped
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Configurer .env}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes: ["./config/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data", "caddy_config:/config"]
    networks: [backend, edge]
    depends_on: [synapse, element]
    restart: unless-stopped
networks:
  backend: {internal: true}
  edge: {}
volumes:
  db: {}
  synapse: {}
  caddy: {}
  caddy_config: {}
  identity_db: {}

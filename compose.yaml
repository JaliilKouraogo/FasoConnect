name: fasoconnect
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurer .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes: ["db:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  init:
    image: ghcr.io/element-hq/synapse:v1.161.0
    entrypoint: [python, /bootstrap/init.py]
    environment:
      DOMAIN: ${DOMAIN:?Configurer .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurer .env}
    volumes: ["synapse:/data", "./scripts/init.py:/bootstrap/init.py:ro"]
    networks: [backend]
  synapse:
    image: ghcr.io/element-hq/synapse:v1.161.0
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    depends_on:
      init: {condition: service_completed_successfully}
      db: {condition: service_healthy}
    volumes: ["synapse:/data"]
    networks: [backend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  element:
    image: vectorim/element-web:v1.12.32
    volumes: ["./config/element.json:/app/config.json:ro"]
    networks: [backend]
    restart: unless-stopped
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Configurer .env}
    ports: ["80:80", "443:443"]
    volumes: ["./config/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data", "caddy_config:/config"]
    networks: [backend, edge]
    depends_on: [synapse, element]
    restart: unless-stopped
networks:
  backend: {internal: true}
  edge: {}
volumes:
  db: {}
  synapse: {}
  caddy: {}
  caddy_config: {}

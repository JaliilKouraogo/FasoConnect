x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
name: fasoconnect
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurer .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes: ["db:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *default-logging
    restart: unless-stopped
  identity-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Configurer .env}
    volumes: ["identity_db:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *default-logging
    restart: unless-stopped
  identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start, --import-realm]
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; read -r response <&3; [[ $$response == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Configurer .env}
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?Configurer .env}
      DOMAIN: ${DOMAIN}
      OIDC_SECRET: ${OIDC_SECRET:?Configurer .env}
      ADMIN_OIDC_SECRET: ${ADMIN_OIDC_SECRET:?Configurer .env}
      PROVISIONER_SECRET: ${PROVISIONER_SECRET:?Configurer .env}
    volumes: ["./config/realm.json:/opt/keycloak/data/import/fasoconnect-realm.json:ro", "./config/keycloak-theme/fasoconnect:/opt/keycloak/themes/fasoconnect:ro"]
    depends_on:
      identity-db: {condition: service_healthy}
    networks: [backend]
    logging: *default-logging
    restart: unless-stopped
  trust-init:
    image: ghcr.io/element-hq/synapse:v1.161.0
    entrypoint: [python, /bootstrap/trust.py]
    volumes: ["caddy:/tls:ro", "trust:/trust", "./scripts/trust.py:/bootstrap/trust.py:ro"]
    depends_on: [proxy]
    networks: [backend]
  init:
    depends_on:
      identity: {condition: service_started}
      db: {condition: service_healthy}
    image: ghcr.io/element-hq/synapse:v1.161.0
    entrypoint: [python, /bootstrap/init.py]
    environment:
      OIDC_SECRET: ${OIDC_SECRET:?Configurer .env}
      DOMAIN: ${DOMAIN:?Configurer .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurer .env}
      ADMIN_OIDC_SECRET: ${ADMIN_OIDC_SECRET}
      PROVISIONER_SECRET: ${PROVISIONER_SECRET}
      IDENTITY_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD}
    volumes: ["synapse:/data", "./scripts/init.py:/bootstrap/init.py:ro", "admin_auth:/admin-auth", "./config/realm.json:/bootstrap/realm.json:ro"]
    networks: [backend]
  synapse:
    entrypoint: [python, /bootstrap/start.py]
    image: ghcr.io/element-hq/synapse:v1.161.0
    environment:
      PYTHONPATH: /modules
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    depends_on:
      trust-init: {condition: service_completed_successfully}
      init: {condition: service_completed_successfully}
      db: {condition: service_healthy}
    volumes: ["synapse:/data", "./scripts/policy.py:/modules/policy.py:ro", "./scripts/start.py:/bootstrap/start.py:ro", "trust:/trust:ro"]
    networks: [backend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
    logging: *default-logging
    restart: unless-stopped
  admin:
    image: fasoconnect-admin:0.1.0
    pull_policy: never
    build: ./admin
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_OIDC_SECRET: ${ADMIN_OIDC_SECRET}
      PROVISIONER_SECRET: ${PROVISIONER_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_EXTRA_CA_CERTS: /trust/root.crt
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}
    volumes: ["trust:/trust:ro", "admin_auth:/admin-auth"]
    networks: [backend, local-ai]
    depends_on:
      synapse: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped
  service-client:
    image: fasoconnect-service-client:0.1.0
    pull_policy: never
    build: ./client
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:8080/service/"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped
  ai:
    image: ollama/ollama:0.40.11
    mem_limit: 5g
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: 2m
    volumes: ["ai_models:/root/.ollama"]
    networks: [local-ai]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: none
    restart: unless-stopped
  element:
    profiles: [reference-client]
    image: vectorim/element-web:v1.12.32
    volumes: ["./config/element.json:/app/config.json:ro"]
    networks: [backend]
    logging: *default-logging
    restart: unless-stopped
  proxy:
    image: caddy:2.10.2-alpine
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 10
    environment:
      DOMAIN: ${DOMAIN:?Configurer .env}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80", "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"]
    volumes: ["./config/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data", "caddy_config:/config"]
    networks:
      backend:
        aliases: [identity.localhost]
      edge: {}
    depends_on: [service-client]
    logging: *default-logging
    restart: unless-stopped
networks:
  backend: {internal: true}
  local-ai: {internal: true}
  edge: {}
volumes:
  db: {}
  synapse: {}
  caddy: {}
  caddy_config: {}
  identity_db: {}
  trust: {}
  admin_auth: {}
  ai_models: {}
